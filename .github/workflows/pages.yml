# 發布手機版網站到 GitHub Pages,並每天更新行情
# - 推程式上來時:直接發布
# - 每個交易日台北時間 19:30:向期交所下載新的逐筆成交 → 轉檔 → 提交 → 發布
# - 也可以在 Actions 頁面手動按 Run workflow
name: 發布與更新行情
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 11 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 下載新行情
        if: github.event_name != 'push'
        id: up
        run: python -I tools/update.py
      - name: 提交新行情
        if: github.event_name != 'push' && steps.up.outputs.got != '0'
        run: |
          git config user.name "arena-bot"
          git config user.email "arena-bot@users.noreply.github.com"
          git add pipeline/arena.db web/data
          git commit -m "行情更新 $(date -u +%F)" && git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
