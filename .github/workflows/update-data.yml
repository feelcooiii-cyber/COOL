# 每天台北時間 19:30(週一到週五)向期交所下載新的逐筆成交,轉成手機版行情檔並提交
name: 更新行情
on:
  schedule:
    - cron: "30 11 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: up
        run: python -I tools/update.py
      - if: steps.up.outputs.got != '0'
        run: |
          git config user.name "arena-bot"
          git config user.email "arena-bot@users.noreply.github.com"
          git add pipeline/arena.db web/data
          git commit -m "行情更新 $(date -u +%F)" && git push
